# enable-template
# The aws cluster for compose.yaml: same cluster name and replication settings as
# ../../aws-values.yaml, with in-memory SQLite, bound to the container's IP.
log:
  stdout: true
  level: warn

persistence:
  defaultStore: sqlite-default
  visibilityStore: sqlite-visibility
  numHistoryShards: 4
  datastores:
    sqlite-default:
      sql:
        pluginName: "sqlite"
        databaseName: "aws"
        connectAddr: "localhost"
        connectProtocol: "tcp"
        connectAttributes:
          mode: "memory"
          cache: "private"
        maxConns: 1
        maxIdleConns: 1
        maxConnLifetime: "1h"
    sqlite-visibility:
      sql:
        pluginName: "sqlite"
        databaseName: "aws-visibility"
        connectAddr: "localhost"
        connectProtocol: "tcp"
        connectAttributes:
          mode: "memory"
          cache: "private"
        maxConns: 1
        maxIdleConns: 1
        maxConnLifetime: "1h"

global:
  membership:
    maxJoinDuration: 30s
    # Set by the image's entrypoint from BIND_ON_IP=0.0.0.0.
    broadcastAddress: "{{ env "TEMPORAL_BROADCAST_ADDRESS" }}"

services:
  frontend:
    rpc:
      grpcPort: 7233
      membershipPort: 6933
      bindOnIP: "0.0.0.0"
      httpPort: 7243
  matching:
    rpc:
      grpcPort: 7235
      membershipPort: 6935
      bindOnIP: "0.0.0.0"
  history:
    rpc:
      grpcPort: 7234
      membershipPort: 6934
      bindOnIP: "0.0.0.0"
  worker:
    rpc:
      grpcPort: 7239
      membershipPort: 6939
      bindOnIP: "0.0.0.0"

clusterMetadata:
  enableGlobalNamespace: true
  failoverVersionIncrement: 10
  masterClusterName: "aws"
  currentClusterName: "aws"
  clusterInformation:
    aws:
      enabled: true
      initialFailoverVersion: 1
      rpcName: "frontend"
      rpcAddress: "aws:7233"
      httpAddress: "aws:7243"

dcRedirectionPolicy:
  policy: "selected-apis-forwarding"
