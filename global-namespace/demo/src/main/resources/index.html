<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Durable Deck</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: system-ui, sans-serif; background: #0b0b14; color: #f2f2f7; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 8vw; text-align: center; }
    #text { font-size: clamp(28px, 5vw, 64px); line-height: 1.2; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; color: #9a9ab0; font-size: 14px; }
    button { font: inherit; font-size: 16px; padding: 10px 22px; border-radius: 8px; border: 1px solid #44445a; background: #1c1c2b; color: inherit; cursor: pointer; }
    button:disabled { opacity: .4; cursor: wait; }
    #error { color: #ff7a7a; }
  </style>
</head>
<body>
  <main><div id="text">Start the workflow to begin.</div></main>
  <footer>
    <button id="prev">&larr; Previous</button>
    <span><span id="pos"></span> <span id="served"></span> <span id="error"></span></span>
    <button id="next">Next &rarr;</button>
  </footer>
  <script>
    const buttons = document.querySelectorAll("button");

    async function call(path, method) {
      buttons.forEach(b => b.disabled = true);
      try {
        const res = await fetch(path, { method });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error);
        document.getElementById("text").textContent = body.text;
        document.getElementById("pos").textContent = `${body.number} / ${body.total}`;
        document.getElementById("served").textContent = `· served by ${body.servedBy}`;
        document.getElementById("error").textContent = "";
      } catch (e) {
        document.getElementById("error").textContent = e.message;
      } finally {
        buttons.forEach(b => b.disabled = false);
      }
    }

    document.getElementById("next").onclick = () => call("/api/next", "POST");
    document.getElementById("prev").onclick = () => call("/api/previous", "POST");
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight" || e.key === " ") call("/api/next", "POST");
      if (e.key === "ArrowLeft") call("/api/previous", "POST");
    });
    call("/api/current", "GET");
  </script>
</body>
</html>
